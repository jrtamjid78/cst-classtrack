<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CST ClassTrack</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4fa;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #1764e8, #103b91);
    color: white;
    padding: 35px 22px;
    border-radius: 0 0 28px 28px;
}

header h1 {
    margin: 0;
    font-size: 29px;
}

header p {
    margin-bottom: 0;
    font-size: 15px;
}

.container {
    padding: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.04);
}

.stats {
    display: flex;
    gap: 12px;
}

.stat {
    flex: 1;
    text-align: center;
    padding: 20px 5px;
    border-radius: 15px;
    background: #e7f7ed;
}

.stat h2 {
    margin: 0;
    color: #087b45;
    font-size: 30px;
}

.stat p {
    margin-bottom: 0;
}

input {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: 1px solid #d5dbe5;
    border-radius: 13px;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 17px;
    background: #1764e8;
    color: white;
    border: none;
    border-radius: 13px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}

h3 {
    font-size: 22px;
}

.student {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>CST ClassTrack</h1>
    <p>Smart Student Attendance System</p>
    <p id="date"></p>
</header>

<div class="container">

    <div class="card stats">

        <div class="stat">
            <h2 id="total">0</h2>
            <p>উপস্থিত</p>
        </div>

        <div class="stat">
            <h2 id="count">0</h2>
            <p>আজকের তালিকায়</p>
        </div>

    </div>

    <div class="card">

        <h3>নিজের উপস্থিতি দাও</h3>

        <p>তোমার রোল নম্বর ও নাম লিখে উপস্থিতি জমা দাও।</p>

        <input
            type="number"
            id="roll"
            placeholder="রোল নম্বর"
            min="1"
        >

        <input
            type="text"
            id="name"
            placeholder="তোমার নাম"
        >

        <button onclick="attendance()">
            আমি উপস্থিত
        </button>

    </div>

    <div class="card">

        <h3>আজকের উপস্থিত শিক্ষার্থীরা</h3>

        <div id="students">
            এখনো কেউ উপস্থিতি দেয়নি।
        </div>

    </div>

</div>

<footer>
    CST ClassTrack © 2026
</footer>

<script>

// আজকের তারিখ
function getToday() {
    const d = new Date();

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

document.getElementById("date").innerText =
    "তারিখ: " + new Date().toLocaleDateString("bn-BD");

const today = getToday();

let records = JSON.parse(
    localStorage.getItem("attendance_" + today) || "[]"
);

// উপস্থিতির তালিকা দেখানো
function showRecords() {

    document.getElementById("total").innerText =
        records.length;

    document.getElementById("count").innerText =
        records.length;

    const students = document.getElementById("students");

    students.innerHTML = "";

    if (records.length === 0) {
        students.innerText = "এখনো কেউ উপস্থিতি দেয়নি।";
        return;
    }

    records.forEach(function(s) {

        const div = document.createElement("div");

        div.className = "student";

        div.textContent = "✅ " + s.roll + " - " + s.name;

        students.appendChild(div);

    });
}

// উপস্থিতি জমা
function attendance() {

    const rollInput = document.getElementById("roll");
    const nameInput = document.getElementById("name");

    const roll = rollInput.value.trim();
    const name = nameInput.value.trim();

    if (!roll || !name) {

        alert("রোল নম্বর ও নাম লিখুন!");

        return;
    }

    if (Number(roll) < 1) {

        alert("সঠিক রোল নম্বর লিখুন!");

        return;
    }

    if (records.some(function(s) {
        return s.roll === roll;
    })) {

        alert("এই রোল দিয়ে ইতিমধ্যে উপস্থিতি দেওয়া হয়েছে!");

        return;
    }

    records.push({
        roll: roll,
        name: name
    });

    localStorage.setItem(
        "attendance_" + today,
        JSON.stringify(records)
    );

    showRecords();

    rollInput.value = "";
    nameInput.value = "";

    alert("তোমার উপস্থিতি গ্রহণ করা হয়েছে!");

}

showRecords();

</script>

</body>
</html>
